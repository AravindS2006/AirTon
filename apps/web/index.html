<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03060c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="AirTon interface demonstration: home eye-pressure monitoring under a doctor's care. Fictional data; no device or clinical service is connected." />
    <title>AirTon · Home IOP Monitoring Demo</title>
    <script>
      // Apply the saved or system theme before the first paint, so there is no flash.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('airton-theme') || 'system'; } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', light ? '#eef1f7' : '#03060c');
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15' fill='%2303060c' stroke='%235f8fff' stroke-width='2'/%3E%3Ccircle cx='17' cy='17' r='8.5' fill='none' stroke='%23ff7a2e' stroke-width='3'/%3E%3Ccircle cx='17' cy='17' r='3.4' fill='%23d6ff3e'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
